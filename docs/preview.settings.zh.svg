<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="回答完成提醒设置项：各开关，右侧为打开的通知语言菜单">
  <defs>
    <linearGradient id="ta-set-zh-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f27"/>
      <stop offset="1" stop-color="#11141a"/>
    </linearGradient>
    <filter id="ta-set-zh-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="640" height="300" fill="url(#ta-set-zh-bg)"/>

  <!-- Settings card: the main example -->
  <rect x="120" y="20" width="340" height="260" rx="10" fill="#22262e" stroke="#333a44"/>
  <text x="142" y="48" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f2f5f8">回答完成提醒</text>
  <text x="142" y="67" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#8d97a5">一轮对话结束时闪烁任务栏并弹出通知。</text>

  <line x1="142" y1="80" x2="438" y2="80" stroke="#2e353f"/>

  <!-- row 1: enabled, on -->
  <text x="142" y="101" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e8edf2">启用提醒</text>
  <rect x="404" y="89" width="34" height="18" rx="9" fill="#2f6fd0"/>
  <circle cx="429" cy="98" r="7" fill="#fff"/>

  <!-- row 2: taskbar flash, on -->
  <text x="142" y="127" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e8edf2">闪烁任务栏图标</text>
  <rect x="404" y="115" width="34" height="18" rx="9" fill="#2f6fd0"/>
  <circle cx="429" cy="124" r="7" fill="#fff"/>

  <!-- row 3: notification, on -->
  <text x="142" y="153" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e8edf2">系统通知</text>
  <rect x="404" y="141" width="34" height="18" rx="9" fill="#2f6fd0"/>
  <circle cx="429" cy="150" r="7" fill="#fff"/>

  <!-- row 4: subagents, off -->
  <text x="142" y="179" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e8edf2">子代理也提醒</text>
  <rect x="404" y="167" width="34" height="18" rx="9" fill="#3a424e"/>
  <circle cx="413" cy="176" r="7" fill="#fff"/>

  <!-- row 5: conversation title, on -->
  <text x="142" y="205" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e8edf2">标题用当前对话标题</text>
  <rect x="404" y="193" width="34" height="18" rx="9" fill="#2f6fd0"/>
  <circle cx="429" cy="202" r="7" fill="#fff"/>

  <!-- row 6: language trigger -->
  <text x="142" y="233" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e8edf2">通知语言</text>
  <rect x="364" y="219" width="74" height="24" rx="7" fill="#2a303a" stroke="#3a424e"/>
  <text x="376" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#dfe5ec">自动</text>
  <path d="M422 229l3 3 3-3" fill="none" stroke="#9aa4b2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Leader from the trigger to the open menu -->
  <path d="M440 231h22" stroke="#2f6fd0" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="441" cy="231" r="2.5" fill="#2f6fd0"/>

  <!-- Close-up: the open menu, fully inside the canvas -->
  <g filter="url(#ta-set-zh-shadow)">
    <rect x="464" y="150" width="150" height="146" rx="8" fill="#2a303a" stroke="#3a424e"/>
  </g>
  <rect x="470" y="156" width="138" height="22" rx="5" fill="#3a424e"/>
  <text x="479" y="171" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#f2f5f8">自动（跟随界面）</text>
  <text x="479" y="194" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#c2cad6">zh</text>
  <text x="479" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#c2cad6">en</text>
  <text x="479" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#c2cad6">ja</text>
  <text x="479" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#c2cad6">ko</text>
  <text x="479" y="282" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8d97a5">…  共九种</text>
</svg>
